
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <div class="card shadow p-4 mx-auto text-center"
         style="max-width: 600px;">

        <h2>Prediction Result</h2>

        <div class="result-box mt-4
             {% if result == 'Benign' %}benign
             {% else %}malignant{% endif %}">

            {{ result }}

        </div>

        <h5 class="mt-4">ANN Output Scores</h5>

        <p>Output 0: {{ "%.4f"|format(scores[0]) }}</p>

        <p>Output 1: {{ "%.4f"|format(scores[1]) }}</p>

        <a href="/predict" class="btn btn-primary mt-3">
            Try Again
        </a>

        <p class="text-muted small mt-4">
            This is an experimental machine learning prediction,
            not a medical diagnosis.
        </p>

    </div>

</div>

</body>
</html>
